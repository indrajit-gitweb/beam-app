name: Deploy Cloudflare Worker

on:
  # Auto-deploy disabled — requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
  # GitHub Secrets to be set before enabling.
  # To deploy manually: copy beam-worker/ to /tmp, npm install, npm run deploy.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: beam-worker
          command: deploy
