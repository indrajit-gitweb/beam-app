name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'beam-android/**'
      - 'index.html'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy latest index.html into Android assets
        run: |
          cp index.html beam-android/app/src/main/assets/index.html
          echo "Copied index.html ($(wc -c < beam-android/app/src/main/assets/index.html) bytes)"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x beam-android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('beam-android/**/*.gradle*', 'beam-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        working-directory: beam-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beam-Android-debug
          path: beam-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show APK info
        run: |
          APK=beam-android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(du -sh $APK | cut -f1)"
          echo "APK path: $APK"
