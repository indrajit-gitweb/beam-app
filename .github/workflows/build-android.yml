name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'beam-android/**'
      - 'index.html'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>/dev/null || true

      - name: Set SDK path in local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > beam-android/local.properties
          echo "SDK path set to: $ANDROID_SDK_ROOT"

      - name: Copy latest index.html into Android assets
        run: |
          cp index.html beam-android/app/src/main/assets/index.html
          echo "Copied index.html — $(wc -c < beam-android/app/src/main/assets/index.html) bytes"

      - name: Grant execute permission for gradlew
        run: chmod +x beam-android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('beam-android/**/*.gradle*', 'beam-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        working-directory: beam-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Beam-Android-debug
          path: beam-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Verify APK is valid
        run: |
          APK=beam-android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then echo "❌ APK not found"; exit 1; fi
          echo "✅ APK size: $(du -sh $APK | cut -f1)"
          # Verify it is a valid ZIP/APK structure
          unzip -t "$APK" > /dev/null && echo "✅ APK structure valid"
          # Check it contains AndroidManifest and classes.dex
          unzip -l "$APK" | grep -E "AndroidManifest|classes.dex" && echo "✅ Required files present"
          # Verify zipalign (signed APK check)
          $ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign -c -v 4 "$APK" > /dev/null && echo "✅ APK is zipaligned" || echo "⚠️ zipalign check failed"
