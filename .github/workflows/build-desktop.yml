name: Build Desktop Packages

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'beam-electron/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Prevent electron-builder from trying to auto-publish to GitHub Releases
  EP_DRAFT: false

jobs:
  build-mac:
    name: Build Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure python command (DMG tool needs it)
        run: command -v python || ln -sf $(which python3) /usr/local/bin/python

      - name: Install dependencies
        working-directory: beam-electron
        run: npm install --no-audit --no-fund

      - name: Build Mac packages
        working-directory: beam-electron
        run: npx electron-builder --mac --publish never

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Beam-Desktop-Mac
          path: |
            beam-electron/dist/*-universal.dmg
            beam-electron/dist/*-universal-mac.zip
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: beam-electron
        run: npm install --no-audit --no-fund

      - name: Build Linux packages
        working-directory: beam-electron
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Beam-Desktop-Linux
          path: beam-electron/dist/*.AppImage
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: beam-electron
        run: npm install --no-audit --no-fund

      - name: Generate icon.ico from icon.png
        # NSIS installer requires .ico format — ImageMagick is pre-installed on windows-latest
        run: magick beam-electron/build/icon.png -resize 256x256 beam-electron/build/icon.ico

      - name: Build Windows packages
        working-directory: beam-electron
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Beam-Desktop-Windows
          path: beam-electron/dist/*.exe
          retention-days: 30
